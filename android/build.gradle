buildscript {
    repositories {
        google()
        mavenCentral()  // jcenter() is deprecated, use this instead
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.0'  // You can upgrade this later
    }
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
    implementation 'com.android.support:appcompat-v7:28.0.0'
    // implementation project(":libs:android-tutorial-3")
}

android {
    compileSdkVersion androidCompileSdkVersion.toInteger()
    buildToolsVersion '28.0.3'

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = [qt5AndroidDir + '/src', 'src', 'java']
            aidl.srcDirs = [qt5AndroidDir + '/src', 'src', 'aidl']
            res.srcDirs = [qt5AndroidDir + '/res', 'res']
            resources.srcDirs = ['resources']
            // renderscript.srcDirs = ['src']  // Disabled Renderscript to fix build with NDK r25+
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }

    buildFeatures {
        renderScript false  // Explicitly disable deprecated feature
    }

    lintOptions {
        abortOnError false
    }

    aaptOptions {
        noCompress 'rcc'
    }
}
