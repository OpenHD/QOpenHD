name: build_android_signed_qt6

on:
  push:

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  BUILD_TYPE: Debug
  QT_VERSION: 6.9.1
  QT_BASE_PARENT: ${{ github.workspace }}/.qt          # aqt install root (stable)
  BUILD_DIR: ${{ github.workspace }}/.build-android    # shadow build dir
  # ---- ccache (make paths stable & maximize hits) ----
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: file_macro,include_file_mtime,time_macros,pch_defines
  CCACHE_CPP2: "true"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "5"
  CCACHE_MAXSIZE: 10G
  CCACHE_UMASK: "002"

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8_debug_apk

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Download Gstreamer
        run: |
          wget https://github.com/OpenHD/gst-full-android/releases/download/withoutqt/gst-android-aarch64.zip
          unzip -q gst-android-aarch64.zip
          rm -f gst-android-aarch64.zip
          tar -xf gst-android-aarch64.tar.gz
          rm -f gst-android-aarch64.tar.gz
          ls -a aarch64

      # Restore ccache as early as possible
      - name: Restore ccache cache
        id: ccache-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-ndk-r27c-${{ matrix.eabi }}-${{ env.BUILD_TYPE }}
          restore-keys: |
            ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-ndk-r27c-${{ matrix.eabi }}-
            ccache-${{ runner.os }}-qt${{ env.QT_VERSION }}-
            ccache-${{ runner.os }}-

      - name: Fix grub EFI CI issue
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache tree cmake ninja-build wget unzip python3 python3-pip
          # Ensure directory exists (safe if already cached)
          mkdir -p "${CCACHE_DIR}"
          # Reset stats for this job and set cache size
          ccache -z
          ccache -M "${CCACHE_MAXSIZE}"
          echo "ccache dir: ${CCACHE_DIR}"
          ccache -p || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK (r27c)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      # --- SDK 35 + Build Tools 35.0.1 (clean install, no preview/ext platforms)
      - name: Install Android SDK Platform 35 and Build Tools 35.0.1
        run: |
          set -euxo pipefail
          export SDK_ROOT=/usr/local/lib/android/sdk
          export CMDLINE_DIR=$SDK_ROOT/cmdline-tools
          export CMDLINE_BIN=$CMDLINE_DIR/latest/bin

          sudo rm -rf "$SDK_ROOT"
          sudo mkdir -p "$CMDLINE_DIR"
          pushd "$CMDLINE_DIR" >/dev/null
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          sudo unzip -q tools.zip
          sudo rm -f tools.zip
          sudo mv cmdline-tools latest
          popd >/dev/null

          sudo chown -R "$USER":"$USER" "$SDK_ROOT"
          export PATH="$CMDLINE_BIN:$PATH"

          mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1"

          rm -rf "$SDK_ROOT/platforms"/android-*-ext* || true
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          "$SDK_ROOT/build-tools/35.0.1/aapt2" version || true

      - name: Export ANDROID env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          sudo chmod -R a+rX /usr/local/lib/android/sdk

      # -------------------- Qt via aqt (host + android) --------------------
      - name: Install Qt ${{ env.QT_VERSION }} (host, aqt)
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       desktop
          arch:         linux_gcc_64
          modules:      qtcharts qtpositioning qtlocation qtmultimedia qtshadertools
          dir:          ${{ env.QT_BASE_PARENT }}
          cache:        true

      - name: Install Qt ${{ env.QT_VERSION }} (android arm64-v8a, aqt)
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          arch:         android_arm64_v8a
          modules:      qtcharts qtpositioning qtlocation qtmultimedia qtshadertools
          dir:          ${{ env.QT_BASE_PARENT }}
          cache:        true

      # --- Hardcode Qt paths (aqt layout; fail fast if missing)
      - name: Export hardcoded Qt paths
        run: |
          set -euxo pipefail
          QT_ROOT="${QT_BASE_PARENT}/Qt"
          QT_HOST_DIR="${QT_ROOT}/${QT_VERSION}/gcc_64"
          QT_ANDROID_DIR="${QT_ROOT}/${QT_VERSION}/android_arm64_v8a"
          QT_TOOLCHAIN_FILE="${QT_ANDROID_DIR}/lib/cmake/Qt6/qt.toolchain.cmake"
          QT_ANDROID_CMAKE_DIR="${QT_ANDROID_DIR}/lib/cmake/Qt6"

          for p in "$QT_HOST_DIR" "$QT_ANDROID_DIR" "$QT_TOOLCHAIN_FILE" "$QT_ANDROID_CMAKE_DIR"; do
            [ -e "$p" ] || { echo "Missing: $p"; exit 1; }
          done

          {
            echo "QT_ROOT=$QT_ROOT"
            echo "QT_HOST_DIR=$QT_HOST_DIR"
            echo "QT_ANDROID_DIR=$QT_ANDROID_DIR"
            echo "QT_TOOLCHAIN_FILE=$QT_TOOLCHAIN_FILE"
            echo "QT_ANDROID_CMAKE_DIR=$QT_ANDROID_CMAKE_DIR"
          } >> "$GITHUB_ENV"

      - name: Create build directory
        run: mkdir -p "${BUILD_DIR}"

      - name: Configure (CMake for Android Qt6; API 35)
        working-directory: ${{ env.BUILD_DIR }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          cd ..
          ls -a $PWD/aarch64/include/gstreamer-1.0
          sudo mkdir -p /home/runner/work/gst-full-android/gst-full-android/prefix
          sudo ln -s $PWD/aarch64 /home/runner/work/gst-full-android/gst-full-android/prefix/aarch64
          ls -a /home/runner/work/gst-full-android/gst-full-android/prefix/aarch64/include/gstreamer-1.0
          cd .build-android
          export GSTREAMER_ROOT_ANDROID="$PWD/third_party/gstreamer-android/arm64-v8a"
          cmake "$SOURCE_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_MAKE_PROGRAM="$(which ninja)" \
            -DCMAKE_TOOLCHAIN_FILE="$QT_TOOLCHAIN_FILE" \
            -DQt6_DIR="$QT_ANDROID_CMAKE_DIR" \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_DIR;$QT_HOST_DIR" \
            -DQT_HOST_PATH="$QT_HOST_DIR" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=${{ matrix.eabi }} \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_PLATFORM=android-35 \
            -DQT_ANDROID_MIN_SDK_VERSION=28 \
            -DQT_ANDROID_TARGET_SDK_VERSION=35 \
            -DQT_ANDROID_SDK_PLATFORM=android-35 \
            -DQT_ANDROID_BUILD_TOOLS_REVISION=35.0.1 \
            -DANDROID_PACKAGE_FORMAT=apk \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          echo "--- androiddeployqt settings sanity ---"
          grep -E '"android-platform"|"sdkBuildToolsRevision"' android-*-deployment-settings.json || true

      - name: Build
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          export GSTREAMER_ROOT_ANDROID="$PWD/third_party/gstreamer-android/arm64-v8a"
          set -euxo pipefail
          cmake --build . --parallel 12
          echo "Built files:"
          find . -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: ccache stats
        run: |
          ccache -sv || ccache -s

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: |
            ${{ env.BUILD_DIR }}/android-build/*.apk
            ${{ env.BUILD_DIR }}/android-build/build/outputs/**/*.apk
          if-no-files-found: warn
