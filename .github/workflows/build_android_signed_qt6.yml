name: build_android_signed_qt6

on:
  push:


defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.6.3
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - architecture: armv7
            eabi: armeabi-v7a
            ARTIFACT: QOpenHD_armv7.aab
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8.aab

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix grub EFI CI issue
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install ccache
        run: sudo apt-get install -y ccache tree

      - name: Install Qt for Android (Qt 6)
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          modules: qtcharts
          setup-python: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r23c
          add-to-path: true

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -z

      - name: Create build directory
        run: mkdir -p ${{ runner.temp }}/shadow_build_dir

      - name: Install GStreamer & FFmpeg (matching arch)
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export API=35
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export RANLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"


          ls /usr/local/lib/android/sdk/platforms/android-35/

          if [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            AR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          elif [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            AR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          else
            echo "[ERROR] Unknown arch: $ARCH"
            exit 1
          fi

          echo "Using AR: $AR"
          ls -l "$AR"

          if [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            export TARGET=armv7a-linux-androideabi
            export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            export AR=$TOOLCHAIN/bin/llvm-ar
            ./fetch_extract_locally.sh -armv7
          elif [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            export TARGET=aarch64-linux-android
            export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            export AR=$TOOLCHAIN/bin/llvm-ar
            ./fetch_extract_locally.sh -arm64
          else
            echo "Unsupported architecture: ${{ matrix.architecture }}"
            exit 1
          fi

      - name: Configure (CMake for Android Qt6)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          QT_HOST_PATH: ${{ steps.install-qt.outputs.qt_root_dir }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake ${SOURCE_DIR} \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_TOOLCHAIN_FILE=${QT_HOST_PATH}/lib/cmake/Qt6/qt.toolchain.cmake \
            -DQT_HOST_PATH=${QT_HOST_PATH} \
            -DANDROID_ABI=${{ matrix.eabi }} \
            -DANDROID_PLATFORM=android-35 \
            -DQT_ANDROID_SIGNING_KEYSTORE=${SOURCE_DIR}/android/qopenhd_key.jks \
            -DQT_ANDROID_SIGNING_ALIAS=qopenhd_key \
            -DQT_ANDROID_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --parallel 12

      - name: ccache stats
        run: ccache -s

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android-build/build/outputs/bundle/release/*.aab
