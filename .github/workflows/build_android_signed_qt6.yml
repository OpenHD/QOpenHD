name: build_android_signed_qt6

on:
  push:

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  BUILD_TYPE: Debug
  QT_VERSION: 6.7.2

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8_debug_apk

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix grub EFI CI issue
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache tree cmake ninja-build wget unzip python3 python3-pip
          ccache -z

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK (r27)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      # --- Clean SDK 35 + build-tools 35.0.0
      - name: Install Android SDK Platform 35 and Build Tools (clean)
        run: |
          set -euxo pipefail
          export SDK_ROOT=/usr/local/lib/android/sdk
          export CMDLINE_DIR=$SDK_ROOT/cmdline-tools
          export CMDLINE_BIN=$CMDLINE_DIR/latest/bin

          sudo rm -rf "$SDK_ROOT"
          sudo mkdir -p "$CMDLINE_DIR"
          pushd "$CMDLINE_DIR" >/dev/null
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          sudo unzip -q tools.zip
          sudo rm -f tools.zip
          sudo mv cmdline-tools latest
          popd >/dev/null

          sudo chown -R "$USER":"$USER" "$SDK_ROOT"
          export PATH="$CMDLINE_BIN:$PATH"

          mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true

          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          rm -rf "$SDK_ROOT/platforms"/android-*-ext* || true

          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          unzip -t "$SDK_ROOT/platforms/android-35/android.jar" >/dev/null

          "$SDK_ROOT/build-tools/35.0.0/aapt2" version || true
          ls -al "$SDK_ROOT/platforms" || true

      - name: Export ANDROID env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          sudo chmod -R a+rX /usr/local/lib/android/sdk

      # -------------------- Qt (host / desktop) --------------------
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       desktop
          arch:         linux_gcc_64
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}/qt-host
          modules:      qtcharts
          cache:        true

      # -------------------- Qt (android) --------------------
      - name: Install Qt (android)
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          arch:         android_arm64_v8a
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}/qt-android
          modules:      qtcharts
          cache:        true

      # --- Hardcode deterministic Qt paths based on install dirs
      - name: Resolve hardcoded Qt paths
        run: |
          set -euxo pipefail
          echo "QT_HOST_DIR=$RUNNER_TEMP/qt-host/${QT_VERSION}/gcc_64" >> $GITHUB_ENV
          echo "QT_ANDROID_DIR=$RUNNER_TEMP/qt-android/${QT_VERSION}/android_arm64_v8a" >> $GITHUB_ENV
          echo "QT_TOOLCHAIN_FILE=$RUNNER_TEMP/qt-android/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake" >> $GITHUB_ENV
          echo "QT_ANDROID_CMAKE_DIR=$RUNNER_TEMP/qt-android/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6" >> $GITHUB_ENV

          test -d "$RUNNER_TEMP/qt-host/${QT_VERSION}/gcc_64"
          test -d "$RUNNER_TEMP/qt-android/${QT_VERSION}/android_arm64_v8a"
          test -f "$RUNNER_TEMP/qt-android/${QT_VERSION}/android_arm64_v8a/lib/cmake/Qt6/qt.toolchain.cmake"

      - name: Create build directory
        run: mkdir -p ${{ runner.temp }}/shadow_build_dir

      - name: Configure (CMake for Android Qt6)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          echo "Using Ninja at: $(which ninja)"
          echo "QT_HOST_DIR=$QT_HOST_DIR"
          echo "QT_ANDROID_DIR=$QT_ANDROID_DIR"
          echo "QT_TOOLCHAIN_FILE=$QT_TOOLCHAIN_FILE"
          echo "QT_ANDROID_CMAKE_DIR=$QT_ANDROID_CMAKE_DIR"

          cmake "$SOURCE_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_MAKE_PROGRAM="$(which ninja)" \
            -DCMAKE_TOOLCHAIN_FILE="$QT_TOOLCHAIN_FILE" \
            -DQt6_DIR="$QT_ANDROID_CMAKE_DIR" \
            -DCMAKE_PREFIX_PATH="$QT_ANDROID_DIR;$QT_HOST_DIR" \
            -DQT_HOST_PATH="$QT_HOST_DIR" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=${{ matrix.eabi }} \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DQT_ANDROID_MIN_SDK_VERSION=23 \
            -DQT_ANDROID_TARGET_SDK_VERSION=35 \
            -DQT_ANDROID_SDK_PLATFORM=android-35 \
            -DQT_ANDROID_BUILD_TOOLS_REVISION=35.0.0 \
            -DANDROID_PACKAGE_FORMAT=apk

          echo "--- androiddeployqt settings sanity ---"
          grep -E '"android-platform"|"sdkBuildToolsRevision"' android-*-deployment-settings.json || true
          ls -1 /usr/local/lib/android/sdk/platforms

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --parallel 12
          echo "Built files:"
          find . -maxdepth 6 -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: ccache stats
        run: ccache -s

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: |
            ${{ runner.temp }}/shadow_build_dir/android-build/*.apk
            ${{ runner.temp }}/shadow_build_dir/android-build/build/outputs/**/*.apk
          if-no-files-found: warn
