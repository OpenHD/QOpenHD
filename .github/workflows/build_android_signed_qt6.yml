name: build_android_signed_qt6

on:
  push:


defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.6.3
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8.aab

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix grub EFI CI issue
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install ccache and tools
        run: |
          sudo apt-get install -y ccache tree cmake ninja-build
          sudo ./install_qt6_build_dep.sh
          sudo pip install meson

      - name: Cache Qt installation
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt6_4_3-install-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.architecture }}

      - name: Install Qt 6.6.3 for Android
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version:      6.6.3
          host:         linux
          target:       android
          arch:         android_arm64_v8a
          modules:      qtcharts
          use-official: false
          # email:        ${{ secrets.QT_EMAIL }}
          # pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ github.workspace }}
          cache:        true
          cache-key-prefix: qt-${{ runner.os }}-${{ env.QT_VERSION }}-${{ matrix.architecture }}

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          set -euxo pipefail

          export SDK_ROOT=/usr/local/lib/android/sdk
          export CMDLINE_DIR=$SDK_ROOT/cmdline-tools
          export CMDLINE_BIN=$CMDLINE_DIR/latest/bin

          sudo rm -rf "$SDK_ROOT/platforms/android-35"
          sudo mkdir -p "$CMDLINE_DIR"
          cd "$CMDLINE_DIR"
          sudo wget -v https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          sudo unzip -q tools.zip
          sudo mv cmdline-tools latest

          export PATH="$CMDLINE_BIN:$PATH"

          sudo mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$SDK_ROOT/licenses/android-sdk-preview-license"

          yes | "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true
          "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" --verbose

      - name: Set ANDROID_HOME and ANDROID_SDK_ROOT
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Ensure SDK permissions
        run: sudo chmod -R a+rX /usr/local/lib/android/sdk

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -z

      - name: Create build directory
        run: mkdir -p ${{ runner.temp }}/shadow_build_dir

      - name: Install GStreamer & FFmpeg (matching arch)
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          QT_ANDROID_PATH: ${{ github.workspace }}/Qt/6.6.3/android_arm64_v8a
        run: |
          export API=35
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64

          if [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            ./fetch_extract_locally.sh -armv7
          elif [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            ./fetch_extract_locally.sh -arm64
          else
            echo "Unsupported architecture: ${{ matrix.architecture }}"
            exit 1
          fi

      - name: Configure (CMake for Android Qt6)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cmake ${SOURCE_DIR} -G "Ninja" \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DQT_HOST_PATH=${QT_HOST_PATH} \
            -DCMAKE_TOOLCHAIN_FILE=$QT_HOST_PATH/lib/cmake/Qt6/qt.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.eabi }} \
            -DANDROID_PLATFORM=android-35 \
            -DQT_ANDROID_SIGNING_KEYSTORE=${SOURCE_DIR}/android/qopenhd_key.jks \
            -DQT_ANDROID_SIGNING_ALIAS=qopenhd_key \
            -DQT_ANDROID_SIGNING_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --parallel 12

      - name: ccache stats
        run: ccache -s

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android-build/build/outputs/bundle/release/*.aab
