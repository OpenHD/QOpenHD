name: build_android_signed_qt6

on:
  push:

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  BUILD_TYPE: Debug
  QT_VERSION: 6.7.2

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8_debug_apk

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix grub EFI CI issue
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache tree cmake ninja-build wget unzip python3 python3-pip
          ccache -z

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK (r27)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: true

      - name: Install Android SDK Platform 35 and Build Tools (clean)
        run: |
          set -euxo pipefail
          export SDK_ROOT=/usr/local/lib/android/sdk
          export CMDLINE_DIR=$SDK_ROOT/cmdline-tools
          export CMDLINE_BIN=$CMDLINE_DIR/latest/bin
          sudo rm -rf "$SDK_ROOT"
          sudo mkdir -p "$CMDLINE_DIR"
          pushd "$CMDLINE_DIR" >/dev/null
          sudo wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          sudo unzip -q tools.zip
          sudo rm -f tools.zip
          sudo mv cmdline-tools latest
          popd >/dev/null
          sudo chown -R "$USER":"$USER" "$SDK_ROOT"
          export PATH="$CMDLINE_BIN:$PATH"
          mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses || true
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          rm -rf "$SDK_ROOT/platforms"/android-*-ext* || true
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          unzip -t "$SDK_ROOT/platforms/android-35/android.jar" >/dev/null
          "$SDK_ROOT/build-tools/35.0.0/aapt2" version || true
          ls -al "$SDK_ROOT/platforms" || true

      - name: Export ANDROID env vars
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          sudo chmod -R a+rX /usr/local/lib/android/sdk

      # Host (desktop) Qt
      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       desktop
          arch:         linux_gcc_64
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          cache:        true

      # Android Qt
      - name: Install Qt (android)
        uses: jurplel/install-qt-action@v4
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          arch:         android_arm64_v8a
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          cache:        true

      - name: Discover Qt paths (search, no guessing)
        shell: bash
        run: |
          set -euo pipefail

          # Places to search (install-qt puts both under $RUNNER_TEMP/Qt)
          ROOTS=("$RUNNER_TEMP/Qt" "$RUNNER_TEMP" "$GITHUB_WORKSPACE" "$HOME/Qt" "/opt/Qt")
          echo "Searching in: ${ROOTS[*]}"

          find_first () { # find first match of a pattern across roots
            pat="$1"
            for r in "${ROOTS[@]}"; do
              mapfile -t hits < <(find "$r" -type f -path "$pat" 2>/dev/null | sort)
              if [ ${#hits[@]} -gt 0 ]; then
                echo "${hits[0]}"
                return 0
              fi
            done
            return 1
          }

          # Host: look for the generic Qt6 CMake config
          host_cfg="$(find_first '*/lib/cmake/Qt6/Qt6Config.cmake')" || {
            echo "Could not find host Qt6Config.cmake"; find "${ROOTS[@]}" -maxdepth 4 -type d | head -200; exit 1; }

          # Android: look for the Qt toolchain file (only in the Android tree)
          android_toolchain="$(find_first '*/lib/cmake/Qt6/qt.toolchain.cmake')" || {
            echo "Could not find Android qt.toolchain.cmake"; find "${ROOTS[@]}" -maxdepth 4 -type d | head -200; exit 1; }

          # Go up: Qt6 -> cmake -> lib -> <QT_PREFIX>
          QT_HOST_PATH="$(dirname "$(dirname "$(dirname "$host_cfg")")")"
          QT_ANDROID_PATH="$(dirname "$(dirname "$(dirname "$android_toolchain")")")"

          echo "QT_HOST_PATH=$QT_HOST_PATH"     | tee -a "$GITHUB_ENV"
          echo "QT_ANDROID_PATH=$QT_ANDROID_PATH" | tee -a "$GITHUB_ENV"

          echo "--- sanity ---"
          ls -al "$QT_HOST_PATH/lib/cmake/Qt6" || true
          ls -al "$QT_ANDROID_PATH/lib/cmake/Qt6" || true

      - name: Sanity check Qt env
        run: |
          echo "QT_HOST_PATH=$QT_HOST_PATH"
          echo "QT_ANDROID_PATH=$QT_ANDROID_PATH"
          ls -al "$QT_ANDROID_PATH/lib/cmake/Qt6" | head

      - name: Create build directory
        run: mkdir -p ${{ runner.temp }}/shadow_build_dir

      - name: Configure (CMake for Android Qt6)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          echo "Using Ninja at: $(which ninja)"
          TOOLCHAIN_FILE="${QT_ANDROID_PATH}/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$TOOLCHAIN_FILE"

          cmake "${SOURCE_DIR}" -G "Ninja" \
            -DCMAKE_MAKE_PROGRAM="$(which ninja)" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DQT_HOST_PATH="${QT_HOST_PATH}" \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_FILE}" \
            -DQt6_DIR="${QT_ANDROID_PATH}/lib/cmake/Qt6" \
            -DCMAKE_PREFIX_PATH="${QT_ANDROID_PATH}/lib/cmake" \
            -DANDROID_ABI=${{ matrix.eabi }} \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DQT_ANDROID_PATH=${QT_ANDROID_PATH} \
            -DQT_ANDROID_MIN_SDK_VERSION=23 \
            -DQT_ANDROID_TARGET_SDK_VERSION=35 \
            -DQT_ANDROID_SDK_PLATFORM=android-35 \
            -DQT_ANDROID_BUILD_TOOLS_REVISION=35.0.0 \
            -DANDROID_PACKAGE_FORMAT=apk

          echo "--- androiddeployqt settings sanity ---"
          grep -E '"android-platform"|"sdkBuildToolsRevision"' android-*-deployment-settings.json || true
          ls -1 /usr/local/lib/android/sdk/platforms

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --parallel 12
          echo "Built files:"
          find . -maxdepth 4 -type f \( -name "*.apk" -o -name "*.aab" \) -print || true

      - name: ccache stats
        run: ccache -s

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: |
            ${{ runner.temp }}/shadow_build_dir/android-build/*.apk
            ${{ runner.temp }}/shadow_build_dir/android-build/build/outputs/**/*.apk
          if-no-files-found: warn
