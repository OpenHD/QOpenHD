name: build_android_signed_qt6

on:
  push:

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR: ${{ github.workspace }}
  QT_VERSION: 6.6.3
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8.aab

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix grub EFI CI issue
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install ccache and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache tree cmake ninja-build wget unzip python3 python3-pip
          sudo ./install_qt6_build_dep.sh
          sudo pip install meson

      - name: Install aqtinstall
        run: |
          python3 -m pip install --upgrade pip
          pip install aqtinstall

      - name: List available Qt modules (desktop + android)
        run: |
          python3 -m aqt list-qt linux desktop 6.6.3 gcc_64 || true
          python3 -m aqt list-qt linux android 6.6.3 android_arm64_v8a || true

      - name: Install host Qt 6.6.3 (gcc_64)
        run: |
          python3 -m aqt install-qt linux desktop 6.6.3 gcc_64 \
            --outputdir "${{ runner.temp }}/Qt" --autodesktop \
            --modules qtcharts

      - name: Install Qt 6.6.3 for Android
        run: |
          python3 -m aqt install-qt linux android 6.6.3 android_arm64_v8a \
            --outputdir "${{ github.workspace }}/Qt" \
            --modules qtcharts

      # - name: Inspect host Qt install
      #   run: |
      #     QT_HOST_PATH="${{ runner.temp }}/Qt/6.6.3/gcc_64"
      #     echo "Looking for expected CMake/Qt6 files under $QT_HOST_PATH/lib/cmake/Qt6"
      #     ls -R "$QT_HOST_PATH/lib/cmake/Qt6" || true
      #     echo "--- fallback search ---"
      #     find "$QT_HOST_PATH/lib/cmake" -maxdepth 4 -type f | head -100

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: true

      - name: Set Qt environment variables
        run: |
          echo "QT_ANDROID_PATH=${{ github.workspace }}/Qt/6.6.3/android_arm64_v8a" >> $GITHUB_ENV
          echo "QT_HOST_PATH=${{ runner.temp }}/Qt/6.6.3/gcc_64" >> $GITHUB_ENV

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          set -euxo pipefail

          export SDK_ROOT=/usr/local/lib/android/sdk
          export CMDLINE_DIR=$SDK_ROOT/cmdline-tools
          export CMDLINE_BIN=$CMDLINE_DIR/latest/bin

          # Fresh cmdline-tools
          sudo rm -rf "$SDK_ROOT/platforms" || true
          sudo mkdir -p "$CMDLINE_DIR"
          cd "$CMDLINE_DIR"
          sudo wget -v https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          sudo unzip -q tools.zip
          sudo rm -rf latest || true
          sudo mv cmdline-tools latest

          # Make the whole SDK tree writable by the current user
          sudo chown -R "$USER":"$USER" "$SDK_ROOT"

          export PATH="$CMDLINE_BIN:$PATH"

          mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license"

          yes | "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true

          # Remove any platforms completely, then install only android-34
          rm -rf "$SDK_ROOT/platforms" || true
          mkdir -p "$SDK_ROOT/platforms"

          "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --uninstall \
            "platforms;android-36" "platforms;android-36-ext*" "platforms;android-35" "platforms;android-35-ext*" || true
          rm -rf "$SDK_ROOT/platforms/android-*-ext*" || true

          "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" "build-tools;34.0.0" --verbose

          ls -al "$SDK_ROOT/platforms" || true

      - name: Set ANDROID_HOME and ANDROID_SDK_ROOT
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Ensure SDK permissions
        run: sudo chmod -R a+rX /usr/local/lib/android/sdk

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -z

      - name: Create build directory
        run: mkdir -p ${{ runner.temp }}/shadow_build_dir

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure (CMake for Android Qt6)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          QT_HOST_PATH: ${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/gcc_64
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euxo pipefail
          echo "Using Ninja at: $(which ninja)"
          QT_HOST_PATH=${QT_HOST_PATH}
          TOOLCHAIN_FILE="${QT_ANDROID_PATH}/lib/cmake/Qt6/qt.toolchain.cmake"
          if [ ! -f "$TOOLCHAIN_FILE" ]; then
            echo "ERROR: Qt toolchain file missing at expected location: $TOOLCHAIN_FILE"
            ls -R "$QT_HOST_PATH/lib/cmake/Qt6" || true
            exit 1
          fi

          cmake "${SOURCE_DIR}" -G "Ninja" \
            -DCMAKE_MAKE_PROGRAM="$(which ninja)" \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DQT_HOST_PATH="${QT_HOST_PATH}" \
            -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_FILE}" \
            -DQt6_DIR="${QT_ANDROID_PATH}/lib/cmake/Qt6" \
            -DCMAKE_PREFIX_PATH="${QT_ANDROID_PATH}/lib/cmake" \
            -DANDROID_ABI=${{ matrix.eabi }} \
            -DQT_ANDROID_ABIS=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DQT_ANDROID_PATH=${QT_ANDROID_PATH} \
            -DQT_ANDROID_MIN_SDK_VERSION=23 \
            -DQT_ANDROID_TARGET_SDK_VERSION=34 \
            -DQT_ANDROID_SDK_PLATFORM=android-34 \
            -DQT_ANDROID_BUILD_TOOLS_REVISION=34.0.0 \
            -DANDROID_PACKAGE_FORMAT=apk
            # REMOVE these for debug build:
            # -DQT_ANDROID_SIGNING_STORE_FILE=...
            # -DQT_ANDROID_SIGNING_KEY_ALIAS=...
            # -DQT_ANDROID_SIGNING_STORE_PASSWORD=...


          grep -E '"android-platform"|"sdkBuildToolsRevision"' android-*-deployment-settings.json || true
          ls -1 /usr/local/lib/android/sdk/platforms

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: |
          cmake --build . --parallel 12
          ls -a

      - name: ccache stats
        run: ccache -s

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android-build/build/outputs/*