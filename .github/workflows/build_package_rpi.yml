name: build_package_rpi

on:
  workflow_dispatch:
  push:
    branches:
      - "2.7-evo"
      - "dev-release"
      - "release"
      - "openhd-3.0"

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/cross_package.yml
    with:
      target: pi-bullseye-armhf
    secrets: inherit
