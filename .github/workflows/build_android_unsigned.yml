name: build_android_unsigned

on: [push]


defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on:  ubuntu-22.04

    strategy:
      matrix:
        include:
          - architecture: armv7
            eabi: armeabi-v7a
            ARTIFACT: QOpenHD_armv7.apk
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8.apk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: fix ci
        run: sudo apt-mark hold grub-efi-amd64-signed
  
      - name: Install ccache
        run:  sudo apt-get install -y ccache
  
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version:      ${{ env.QT_VERSION }}
          host:         linux
          target:       android
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: false

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

      - name: Create build directory
        run:  mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Install gstreamer
        working-directory:  ${{ github.workspace }}
        run: |
          cd lib/gstreamer_prebuilts/
          ./fetch_extract_locally.sh

      - name: Build qmlglsink
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build python3-pip
          pip3 install meson==1.2.3

          API=34
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          QT_DIR="${{ runner.temp }}/Qt/${{ env.QT_VERSION }}/android_${{ matrix.eabi }}"
          GST_ANDROID_DIR="${GITHUB_WORKSPACE}/lib/gstreamer_prebuilts/gstreamer-1.0-android-universal"
          
          if [[ "${{ matrix.eabi }}" == "armeabi-v7a" ]]; then
            TARGET="armv7a-linux-androideabi"
            CPU="armv7"
            CPU_FAMILY="arm"
          else
            TARGET="aarch64-linux-android"
            CPU="aarch64"
            CPU_FAMILY="aarch64"
          fi

          CC="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}${API}-clang"
          CXX="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/${TARGET}${API}-clang++"
          STRIP="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          TEMPLATE="${GITHUB_WORKSPACE}/android/cross-android.template.txt"
          CROSS_FILE="${GITHUB_WORKSPACE}/android/generated-cross-${{ matrix.eabi }}.txt"

          sed \
            -e "s|@CC@|$CC|" \
            -e "s|@CXX@|$CXX|" \
            -e "s|@STRIP@|$STRIP|" \
            -e "s|@CPU@|$CPU|" \
            -e "s|@CPU_FAMILY@|$CPU_FAMILY|" \
            -e "s|@QT_DIR@|$QT_DIR|" \
            "$TEMPLATE" > "$CROSS_FILE"

          git clone --depth 1 https://gitlab.freedesktop.org/gstreamer/gstreamer-qt.git
          cd gstreamer-qt

          meson setup build-android \
            --cross-file "$CROSS_FILE" \
            --prefix="$(pwd)/install" \
            -Dqml=enabled \
            -Dexamples=disabled \
            -Dandroid_ndk="$NDK_PATH" \
            -Dandroid_sdk_version="$API" \
            -Dgstreamer-1.0:gi=false

          ninja -C build-android install

          # Determine sub-ABI path from install (auto-matched to universal path)
          ABI_PATH=$(find "${GST_ANDROID_DIR}/lib" -name "${TARGET}" -type d | head -n1)
          mkdir -p "${ABI_PATH}/gstreamer-1.0"
          cp build-android/plugins/aqmlglsink/libgstaqmlglsink.so "${ABI_PATH}/gstreamer-1.0/"


      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run:  |
          qmake ${SOURCE_DIR}/QOpenHD.pro -spec android-clang CONFIG+=installer ANDROID_ABIS="${{ matrix.eabi }}"
          make -j$(($(nproc)/2)) qmake_all
          make -j12
          make install INSTALL_ROOT=android
          androiddeployqt --output android --verbose --input android-QOpenHD-deployment-settings.json  --android-platform android-34 --gradle

      - name: ccache post-run
        run:  ccache -s

      - name: Rename APK with datetime
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M")
          APK_PATH=$(find ${{ runner.temp }}/shadow_build_dir/android/build/outputs/apk/debug -name "*.apk" | head -n 1)
          NEW_NAME="build_android_unsigned_${TIMESTAMP}.apk"
          mv "$APK_PATH" "${{ runner.temp }}/shadow_build_dir/android/build/outputs/apk/debug/${NEW_NAME}"
          echo "RENAMED_APK=${{ runner.temp }}/shadow_build_dir/android/build/outputs/apk/debug/${NEW_NAME}" >> $GITHUB_ENV

      - name: Upload renamed artifact
        uses: actions/upload-artifact@master
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ env.RENAMED_APK }}
