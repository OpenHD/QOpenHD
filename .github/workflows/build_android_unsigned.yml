name: build_android_unsigned

on: [push]

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.2
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - architecture: armv7
            eabi: armeabi-v7a
            ARTIFACT: QOpenHD_armv7.apk
          - architecture: armv8
            eabi: arm64-v8a
            ARTIFACT: QOpenHD_armv8.apk

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: fix ci
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          dir: ${{ runner.temp }}
          modules: qtcharts
          setup-python: true

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r22b
          add-to-path: true

      - name: Accept Android SDK licenses if sdkmanager exists
        run: |
          SDKMANAGER_PATH=$(find $ANDROID_SDK_ROOT -type f -name sdkmanager | head -n 1 || true)
          if [[ -x "$SDKMANAGER_PATH" ]]; then
            echo "Found sdkmanager at $SDKMANAGER_PATH"
            yes | "$SDKMANAGER_PATH" --licenses
          else
            echo "sdkmanager not found, skipping licenses acceptance"
          fi
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}


      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;33.0.2"

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        run: |
          echo "::set-output name=timestamp::$(date -u +'%Y-%m-%d-%H:%M:%S')"

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

      - name: Create build directory
        run: mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Install gstreamer
        working-directory: ${{ github.workspace }}
        run: |
          cd lib/gstreamer_prebuilts/
          ./fetch_extract_locally.sh

      - name: Build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          qmake ${SOURCE_DIR}/QOpenHD.pro -spec android-clang CONFIG+=installer ANDROID_ABIS="${{ matrix.eabi }}"
          make -j$(($(nproc)/2)) qmake_all
          make -j12
          make install INSTALL_ROOT=android
          androiddeployqt --output android --verbose --input android-QOpenHD-deployment-settings.json --android-platform android-35 --gradle

      - name: ccache post-run
        run: ccache -s

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/apk/debug/*.apk
