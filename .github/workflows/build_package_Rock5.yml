name: build_package_radxa_arm64_debian

on:
  workflow_dispatch:
  push:
    branches:
      - "2.7-evo"
      - "dev-release"
      - "release"
      - "rapha-dev"
      - "openhd-3.0"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [rock-bullseye-arm64, rock-bookworm-arm64]
    uses: ./.github/workflows/cross_package.yml
    with:
      target: ${{ matrix.target }}
    secrets: inherit
