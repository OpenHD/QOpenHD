name: build_windows_installer

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: SignPath mode (test builds are not publicly trusted)
        type: choice
        options: [none, test, release]
        default: none
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'
  push:
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'

permissions:
  contents: read
  actions: read

env:
  QT_VERSION: 5.15.2
  BUILD_TYPE: Release
  FFMPEG_ARCHIVE: ffmpeg-n5.1-latest-win32-lgpl-shared-5.1.zip
  FFMPEG_SHA256: ef966e53e5bbae6e2e8a4d313fac0ae93b2b42a0ddec978e6131df98dfa345d0

jobs:
  openssl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Cache Windows TLS runtime
        id: openssl-cache
        uses: actions/cache@v6
        with:
          path: windows-openssl
          key: win32-openssl-${{ runner.os }}-${{ hashFiles('ci/build-windows-openssl.sh') }}
      - name: Build Windows TLS runtime
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686-posix
          bash ci/build-windows-openssl.sh windows-openssl
      - uses: actions/upload-artifact@v7
        with:
          name: windows-openssl
          path: windows-openssl/

  build:
    needs: openssl
    env:
      SIGNING_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_mode || 'none' }}
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate signing configuration
        if: env.SIGNING_MODE != 'none'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_TEST_CERTIFICATE_BASE64: ${{ vars.SIGNPATH_TEST_CERTIFICATE_BASE64 }}
          SIGNPATH_TEST_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG }}
          SIGNPATH_RELEASE_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_RELEASE_SIGNING_POLICY_SLUG }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'OpenHD/QOpenHD' -or $env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'Signing requires a manual run in OpenHD/QOpenHD'
          }
          foreach ($name in @('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing $name" }
          }
          $policy = if ($env:SIGNING_MODE -eq 'test') { $env:SIGNPATH_TEST_SIGNING_POLICY_SLUG } else { $env:SIGNPATH_RELEASE_SIGNING_POLICY_SLUG }
          if ([string]::IsNullOrWhiteSpace($policy)) { throw 'Missing signing policy' }
          if ($env:SIGNING_MODE -eq 'test') {
            & tools/trust_signpath_test_certificate.ps1 -CertificateBase64 $env:SIGNPATH_TEST_CERTIFICATE_BASE64
          }

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win32_mingw81
          modules: qtcharts
          tools: tools_mingw,qt.tools.win32_mingw810
          setup-python: true

      - name: Install build tools
        run: choco install nsis -y --no-progress

      - name: Download Windows TLS runtime
        uses: actions/download-artifact@v8
        with:
          name: windows-openssl
          path: build-libs-windows/openssl

      - name: Configure Windows TLS runtime
        run: |
          "QOPENHD_OPENSSL_BIN=$(Join-Path $env:GITHUB_WORKSPACE 'build-libs-windows\openssl')" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install FFmpeg SDK
        run: |
          $downloadUrl = "https://github.com/sudo-nautilus/FFmpeg-Builds-Win32/releases/download/latest/$env:FFMPEG_ARCHIVE"
          $archive = Join-Path $env:RUNNER_TEMP $env:FFMPEG_ARCHIVE
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-sdk"
          $destination = Join-Path $env:GITHUB_WORKSPACE "build-libs-windows\ffmpeg"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FFMPEG_SHA256) {
            throw "FFmpeg archive checksum mismatch: $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extractDir
          $ffmpegRoot = Get-ChildItem -LiteralPath $extractDir -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "include\libavcodec\avcodec.h") } |
            Select-Object -First 1
          if (!$ffmpegRoot) {
            throw "The FFmpeg archive does not contain the expected development SDK"
          }

          New-Item -ItemType Directory -Path (Split-Path -Parent $destination) -Force | Out-Null
          Move-Item -LiteralPath $ffmpegRoot.FullName -Destination $destination

      - name: Verify Qt and MinGW toolchain
        run: |
          $mingwMake = Get-ChildItem -LiteralPath $env:IQTA_TOOLS -Filter mingw32-make.exe -Recurse -File |
            Select-Object -First 1
          if (!$mingwMake) {
            throw "Could not find the Qt MinGW toolchain below $env:IQTA_TOOLS"
          }

          $mingwBin = Split-Path -Parent $mingwMake.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $mingwBin
          "QT_MINGW_BIN=$mingwBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          qmake -v
          & $mingwMake.FullName --version

      - name: Test saved map settings and provider recovery
        run: python tests/run_map_provider_test.py --qt-bin (Split-Path (Get-Command qmake).Source)

      - name: Test offline map picker and position fallback
        run: |
          $qtBin = Split-Path (Get-Command qmake).Source
          python tests/run_offline_map_ui_test.py --qt-bin $qtBin --screenshot "$env:RUNNER_TEMP/offline-map-picker.png"
          if ($LASTEXITCODE -ne 0) { throw "Offline map picker failed" }
          python tests/run_position_fallback_test.py --qt-bin $qtBin
          if ($LASTEXITCODE -ne 0) { throw "Position fallback failed" }

      - name: Test Internet ADS-B without SDR
        run: |
          $env:Path = "$env:QT_MINGW_BIN;$env:Path"
          New-Item -ItemType Directory -Path adsb-test -Force | Out-Null
          Push-Location adsb-test
          qmake ../tests/adsb_internet_test.pro CONFIG+=release
          & (Join-Path $env:QT_MINGW_BIN "mingw32-make.exe") -j2 "SHELL=cmd.exe"
          if ($LASTEXITCODE -ne 0) { throw "ADS-B test build failed" }
          & ./release/adsb_internet_test.exe -o results.txt,txt
          if ($LASTEXITCODE -ne 0) { Get-Content results.txt; throw "ADS-B tests failed" }
          Get-Content results.txt
          Pop-Location

      - name: Configure
        run: |
          $env:Path = "$env:QT_MINGW_BIN;$env:Path"
          $env:SHELL = "cmd.exe"
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Push-Location build
          qmake `
            CONFIG+=release `
            CONFIG+=lowmemrelease `
            ..\QOpenHD.pro
          Pop-Location

      - name: Build and deploy
        run: |
          $env:Path = "$env:QT_MINGW_BIN;$env:Path"
          $env:SHELL = "cmd.exe"
          & (Join-Path $env:QT_MINGW_BIN "mingw32-make.exe") -C build -j2 "SHELL=cmd.exe"

      - name: Verify deployed TLS without developer PATH
        run: |
          $env:Path = "$env:QT_MINGW_BIN;$env:Path"
          New-Item -ItemType Directory -Path tls-test -Force | Out-Null
          Push-Location tls-test
          qmake ../tests/windows_tls_test.pro CONFIG+=release
          & (Join-Path $env:QT_MINGW_BIN "mingw32-make.exe") -j2 "SHELL=cmd.exe"
          if ($LASTEXITCODE -ne 0) { throw "TLS probe build failed" }
          Pop-Location
          $deployDir = Join-Path $env:GITHUB_WORKSPACE "build/release"
          $probe = Join-Path $deployDir "windows_tls_test.exe"
          Copy-Item tls-test/release/windows_tls_test.exe $probe
          $originalPath = $env:Path
          try {
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            & $probe
            if ($LASTEXITCODE -ne 0) { throw "The deployed app cannot load TLS libraries" }
          } finally {
            $env:Path = $originalPath
            Remove-Item -LiteralPath $probe
          }

      - name: Prepare application and uninstaller for signing
        if: env.SIGNING_MODE != 'none'
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'qopenhd-unsigned-application'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $generator = Join-Path $env:RUNNER_TEMP 'qopenhd-uninstaller-generator.exe'
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" /DINNER "/DOUTFILE=$generator" "/DUNINSTALLER_OUTPUT=$stage/QOpenHD-Uninstall.exe" tools/qopenhd_installer.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Uninstaller generator build failed' }
          $process = Start-Process -FilePath $generator -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path "$stage/QOpenHD-Uninstall.exe")) { throw 'Uninstaller generation failed' }
          Copy-Item build/release/QOpenHD.exe $stage

      - name: Upload unsigned application
        if: env.SIGNING_MODE != 'none'
        id: unsigned-application
        uses: actions/upload-artifact@v4
        with:
          name: QOpenHD-unsigned-application
          path: ${{ runner.temp }}/qopenhd-unsigned-application/*
          if-no-files-found: error
          retention-days: 7

      - name: Sign application with SignPath
        if: env.SIGNING_MODE != 'none'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_MODE == 'test' && vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG || vars.SIGNPATH_RELEASE_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: qopenhd-application
          github-artifact-id: ${{ steps.unsigned-application.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/qopenhd-signed-application

      - name: Verify signed application
        if: env.SIGNING_MODE != 'none'
        run: |
          foreach ($file in @('QOpenHD.exe', 'QOpenHD-Uninstall.exe')) {
            $source = Join-Path $env:RUNNER_TEMP "qopenhd-signed-application/$file"
            & tools/verify_windows_signature.ps1 -Path $source -SigningMode $env:SIGNING_MODE -ExpectedSignerThumbprint $env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT
            Copy-Item -LiteralPath $source -Destination build/release -Force
          }

      - name: Build NSIS installer
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          $deployDir = Join-Path $buildDir "release"
          $installer = Join-Path $buildDir "QOpenHD-Windows-Installer.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\qopenhd_installer.nsi"
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"

          if (!(Test-Path -LiteralPath (Join-Path $deployDir "QOpenHD.exe") -PathType Leaf)) {
            throw "Missing deployed executable: $(Join-Path $deployDir "QOpenHD.exe")"
          }

          if (!(Test-Path -LiteralPath $makensis -PathType Leaf)) {
            $makensis = "makensis"
          }

          $signArguments = @()
          if ($env:SIGNING_MODE -ne 'none') {
            $signArguments += "/DSIGNED_UNINSTALLER=$deployDir/QOpenHD-Uninstall.exe"
          }
          & $makensis @signArguments `
            "/DDESTDIR=$deployDir" `
            "/DOUTFILE=$installer" `
            $script
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }

      - name: Upload unsigned installer
        if: env.SIGNING_MODE != 'none'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: QOpenHD-unsigned-installer
          path: build/QOpenHD-Windows-Installer.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign installer with SignPath
        if: env.SIGNING_MODE != 'none'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          connector-url: https://pipelineconnector.connectors.signpath.io/GitHub/GitHubCom
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_MODE == 'test' && vars.SIGNPATH_TEST_SIGNING_POLICY_SLUG || vars.SIGNPATH_RELEASE_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: qopenhd-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: ${{ runner.temp }}/qopenhd-signed-installer

      - name: Verify signed installer
        if: env.SIGNING_MODE != 'none'
        run: |
          foreach ($file in @('QOpenHD-Windows-Installer.exe')) {
            $source = Join-Path $env:RUNNER_TEMP "qopenhd-signed-installer/$file"
            & tools/verify_windows_signature.ps1 -Path $source -SigningMode $env:SIGNING_MODE -ExpectedSignerThumbprint $env:SIGNPATH_TEST_CERTIFICATE_THUMBPRINT
            Copy-Item -LiteralPath $source -Destination build -Force
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: QOpenHD-Windows-Installer${{ env.SIGNING_MODE == 'test' && '-Test-Signed' || (env.SIGNING_MODE == 'release' && '-Signed' || '-Unsigned') }}
          path: build/QOpenHD-Windows-Installer.exe
