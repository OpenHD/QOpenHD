name: build_windows_installer

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'
  push:
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'

env:
  QT_VERSION: 5.15.2
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Qt
        id: install-qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win32_mingw81
          modules: qtcharts
          tools: tools_mingw,qt.tools.win32_mingw810
          setup-python: true

      - name: Install build tools
        run: choco install nsis -y --no-progress

      - name: Verify Qt and MinGW toolchain
        run: |
          qmake -v
          mingw32-make --version

      - name: Configure
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          Push-Location build
          qmake `
            CONFIG+=release `
            CONFIG+=lowmemrelease `
            ..\QOpenHD.pro
          Pop-Location

      - name: Build and deploy
        run: mingw32-make -C build -j2

      - name: Build NSIS installer
        run: |
          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          $deployDir = Join-Path $buildDir "release"
          $installer = Join-Path $buildDir "QOpenHD-Windows-Installer.exe"
          $script = Join-Path $env:GITHUB_WORKSPACE "tools\qopenhd_installer.nsi"
          $makensis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"

          if (!(Test-Path -LiteralPath (Join-Path $deployDir "QOpenHD.exe") -PathType Leaf)) {
            throw "Missing deployed executable: $(Join-Path $deployDir "QOpenHD.exe")"
          }

          if (!(Test-Path -LiteralPath $makensis -PathType Leaf)) {
            $makensis = "makensis"
          }

          & $makensis `
            "/DDESTDIR=$deployDir" `
            "/DOUTFILE=$installer" `
            $script

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: QOpenHD-Windows-Installer
          path: build/QOpenHD-Windows-Installer.exe
