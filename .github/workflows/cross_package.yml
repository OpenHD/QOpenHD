name: Native host cross package

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      publish:
        default: true
        type: boolean
    secrets:
      CLOUDSMITH_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install native host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential perl curl git \
            dpkg-dev mmdebstrap debian-archive-keyring gnupg python3-pip pkg-config ruby-dev cmake ninja-build libwayland-bin
          sudo gem install fpm --version 1.16.0 --no-document
      - name: Cache native Qt tools shared by ARM targets
        id: host-qt-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cross-build/qt-host-*
            .cross-build/*.tar.xz
          key: qopenhd-qt-host-v2-${{ runner.os }}-5.15.4-static-tools
      - name: Cache target compiler and sysroot
        uses: actions/cache@v6
        with:
          path: |
            .cross-build/gcc-*
            .cross-build/sysroot-*
            .cross-build/*.tar.bz2
          key: qopenhd-cross-v1-${{ runner.os }}-${{ inputs.target }}-${{ hashFiles('ci/cross-build.sh', 'ci/relativize-sysroot.py') }}
      - name: Compile and package without target emulation
        env:
          CROSS_TARGET: ${{ inputs.target }}
        run: bash ci/cross-build.sh "$CROSS_TARGET"
      - name: Verify runtime package dependencies
        env:
          CROSS_TARGET: ${{ inputs.target }}
        run: |
          python3 ci/test_package_dependencies.py
          python3 ci/test_rockchip_native_package.py
          python3 tests/native_rtp_sender_test.py
          python3 tests/rockchip_display_role_test.py
          for package in ./*.deb; do
            dependencies=$(dpkg-deb -f "$package" Depends)
            echo "$package: $dependencies"
            if printf '%s\n' "$dependencies" | grep -Eq '(^|[ ,])[^ ,]*(-dev|qmake)[^ ,]*'; then
              echo "Runtime package unexpectedly depends on development headers or tools" >&2
              exit 1
            fi
          done
      - name: Keep completed host tools even if a target build fails
        if: always() && steps.host-qt-cache.outputs.cache-hit != 'true' && hashFiles('.cross-build/qt-host-*/.complete') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .cross-build/qt-host-*
            .cross-build/*.tar.xz
          key: ${{ steps.host-qt-cache.outputs.cache-primary-key }}
      - name: Upload packages and ELF inspection
        uses: actions/upload-artifact@v7
        with:
          name: QOpenHD-${{ inputs.target }}
          path: |
            *.deb
            .cross-build/build-*/elf-*.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Publish packages
        if: inputs.publish && (github.ref_name == 'release' || github.ref_name == 'dev-release')
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          CROSS_TARGET: ${{ inputs.target }}
          PACKAGE_REPO: ${{ github.ref_name }}
        run: |
          python3 -m pip install cloudsmith-cli
          case "$CROSS_TARGET" in
            pi-bullseye-armhf) distro=raspbian; release=bullseye ;;
            pi-bookworm-arm64) distro=raspbian; release=bookworm ;;
            rock-bookworm-arm64) distro=debian; release=bookworm ;;
            rock-bullseye-arm64) distro=debian; release=bullseye ;;
            *) exit 2 ;;
          esac
          for package in ./*.deb; do
            cloudsmith push deb --republish "openhd/$PACKAGE_REPO/$distro/$release" "$package"
          done
