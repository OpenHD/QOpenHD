name: build_package_rpi5_bookworm

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENHD_SNAPSHOT_NUMBER: ${{ github.ref_name == 'snapshots' && github.run_number || '' }}

jobs:
  build:
    uses: ./.github/workflows/cross_package.yml
    with:
      target: pi-bookworm-arm64
    secrets: inherit
