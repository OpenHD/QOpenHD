name: build_android_signed

on:
  push:
    branches:
      - "2.6-evo"
      - "dev-release"
      - "new_testing"
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.19
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - architecture: armv7
            eabi: armeabi-v7a
            ffmpeg_arch: armeabi
            ARTIFACT: QOpenHD_armv7.aab
          - architecture: armv8
            eabi: arm64-v8a
            ffmpeg_arch: arm64
            ARTIFACT: QOpenHD_armv8.aab

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix CI grub error
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache curl yasm pkg-config build-essential git python3-distro

      - name: Cache Qt installation
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-install-${{ runner.os }}-${{ env.QT_VERSION }}

      - name: Install Qt (only if not cached)
        uses: jurplel/install-qt-action@v4
        with:
          version:      '5.15.19'
          host:         linux
          target:       android
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: true


      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false
          local-cache: true

      - name: Install Android NDK manually for Cerbero
        run: |
          mkdir -p "$HOME/cerbero/build"
          cd "$HOME/cerbero/build"
          curl -LO https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          mv -v android-ndk-r25c android-ndk-25
          ls /home/runner/cerbero/build/android-ndk-25/toolchains/llvm/prebuilt/linux-x86_64/bin/

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

      - name: Create build directory
        run: mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Bootstrap and build GStreamer
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          ./fetch_extract_locally.sh "$NDK_ROOT"

      - name: Build QOpenHD
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e

          # Inject FFmpeg path if needed
          export FF_PREFIX=$GITHUB_WORKSPACE/ffmpeg-build/${{ matrix.ffmpeg_arch }}
          export LDFLAGS="-L$FF_PREFIX/lib"
          export CFLAGS="-I$FF_PREFIX/include"

          qmake ${SOURCE_DIR}/QOpenHD.pro -spec android-clang CONFIG+=installer ANDROID_ABIS="${{ matrix.eabi }}" BUILD_TYPE=Release
          make -j$(($(nproc)/2)) qmake_all
          make -j12
          make install INSTALL_ROOT=android

          echo ">>> Starting androiddeployqt..."
          androiddeployqt \
            --output android \
            --verbose \
            --input android-QOpenHD-deployment-settings.json \
            --android-platform android-34 \
            --gradle \
            --aab \
            --release \
            --sign ${SOURCE_DIR}/android/qopenhd_key.jks qopenhd_key \
            --storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            || { echo "androiddeployqt failed!"; exit 1; }

          zip -r file.zip .

      - name: Print Android build logs (optional)
        if: failure()
        run: |
          echo "🪵 Dumping Android logs..."
          find android -type f \( -name "*.log" -o -name "*.txt" \) -exec echo "== {} ==" \; -exec cat {} \; || true

      - name: ccache post-run
        run: ccache -s

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/bundle/release/*.aab
