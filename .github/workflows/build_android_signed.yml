name: build_android_signed

on:
  push:
    branches:
      - "2.6-evo"
      - "dev-release"
      - "new_testing"
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.19
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv7
            eabi: armeabi-v7a
            ffmpeg_arch: armeabi
            ARTIFACT: QOpenHD_armv7.aab
          - architecture: armv8
            eabi: arm64-v8a
            ffmpeg_arch: arm64
            ARTIFACT: QOpenHD_armv8.aab

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix CI grub error
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache curl yasm pkg-config build-essential git python3-distro

      - name: Cache Qt installation
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-install-${{ runner.os }}-${{ env.QT_VERSION }}

      - name: Install Qt (only if not cached)
        uses: jurplel/install-qt-action@v4
        with:
          version:      '5.15.19'
          host:         linux
          target:       android
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: true


      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false
          local-cache: true

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

      - name: Create build directory
        run: mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Install GStreamer & FFmpeg (matching arch)
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export API=35
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export RANLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"

          if [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            AR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          elif [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            AR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          else
            echo "[ERROR] Unknown arch: $ARCH"
            exit 1
          fi

          echo "Using AR: $AR"
          ls -l "$AR"

          if [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            export TARGET=armv7a-linux-androideabi
            export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            export AR=$TOOLCHAIN/bin/llvm-ar
            ./fetch_extract_locally.sh -armv7
          elif [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            export TARGET=aarch64-linux-android
            export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            export AR=$TOOLCHAIN/bin/llvm-ar
            ./fetch_extract_locally.sh -arm64
          else
            echo "Unsupported architecture: ${{ matrix.architecture }}"
            exit 1
          fi

      - name: list failiours
        if: failure()
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        run: |
            ls -a
            tree
      
      - name: Upload FFmpeg config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log-${{ matrix.architecture }}
          path: ${{ github.workspace }}/lib/gstreamer_prebuilts/ffmpeg-6.1.1/ffbuild/config.log

      - name: Check Gradle version
        run: gradle --version

      - name: Install Gradle 7.6
        run: |
          wget https://services.gradle.org/distributions/gradle-7.6-bin.zip
          unzip -q gradle-7.6-bin.zip -d $HOME/gradle-7.6
          echo "$HOME/gradle-7.6/gradle-7.6/bin" >> $GITHUB_PATH

      - name: Build QOpenHD
        id: build
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e

          qmake ${SOURCE_DIR}/QOpenHD.pro -spec android-clang CONFIG+=installer ANDROID_ABIS="${{ matrix.eabi }}" BUILD_TYPE=Release
          make -j$(($(nproc)/2)) qmake_all
          make -j12
          make install INSTALL_ROOT=android

          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6-bin.zip
          EOF

          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          ls -a

          androiddeployqt \
            --output android \
            --verbose \
            --input android-QOpenHD-deployment-settings.json \
            --android-platform android-35 \
            --gradle \
            --gradle-template ${SOURCE_DIR}/android/build.gradle \
            --release \
            --sign ${SOURCE_DIR}/android/qopenhd_key.jks qopenhd_key \
            --storepass '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'

          echo "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"

          # Ensure androiddeployqt does NOT download old Gradle
          WRAPPER_PATH=$(find android -name gradle-wrapper.properties | head -n1)
          if [ -f "$WRAPPER_PATH" ]; then
            echo "Patching Gradle wrapper to 7.6"
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6-bin.zip#' "$WRAPPER_PATH"
            cat "$WRAPPER_PATH"
          else
            echo "Gradle wrapper properties not found"
            exit 1
          fi

          # Save fallback APK in case Gradle fails later
          APK_PATH="android/build/outputs/apk/android-release-signed.apk"
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" android-release-fallback.apk
          fi

          # Patch Gradle wrapper version to prevent errors (even though we don't use it)
          WRAPPER_PATH=$(find android -name gradle-wrapper.properties | head -n1)
          if [ -f "$WRAPPER_PATH" ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-7.6-bin.zip#' "$WRAPPER_PATH"
          fi

      - name: Build .aab with Gradle 7.6
        id: gradle
        working-directory: ${{ runner.temp }}/shadow_build_dir/android
        continue-on-error: true
        run: |
          gradle bundleRelease || exit 66

      - name: Upload fallback APK if Gradle failed
        if: steps.gradle.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FallbackAPK_${{ matrix.eabi }}
          path: ${{ runner.temp }}/shadow_build_dir/android-release-fallback.apk

      - name: Upload final .aab if Gradle succeeded
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/bundle/release/*.aab

      - name: Print Android build logs (optional)
        if: failure()
        run: |
          echo "Dumping Android logs..."
          find android -type f \( -name "*.log" -o -name "*.txt" \) -exec echo "== {} ==" \; -exec cat {} \; || true

      - name: ccache post-run
        run: ccache -s

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/bundle/release/*.aab
