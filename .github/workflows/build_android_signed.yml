name: build_android_signed

on:
  push:
    branches:
      - "2.6-evo"
      - "dev-release"
      - "new_testing"
    paths-ignore:
      - '**.md'
      - '**.asciidoc'
      - '**.adoc'
      - '.gitignore'
      - 'LICENSE'

defaults:
  run:
    shell: bash

env:
  SOURCE_DIR:   ${{ github.workspace }}
  QT_VERSION:   5.15.19
  BUILD_TYPE:   ${{ fromJSON('["DailyBuild", "StableBuild"]')[ github.ref_type == 'tag' || contains(github.ref, 'Stable_' ) ] }}

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - architecture: armv7
            eabi: armeabi-v7a
            ffmpeg_arch: armeabi
            ARTIFACT: QOpenHD_armv7.aab
          - architecture: armv8
            eabi: arm64-v8a
            ffmpeg_arch: arm64
            ARTIFACT: QOpenHD_armv8.aab

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Fix CI grub error
        run: sudo apt-mark hold grub-efi-amd64-signed

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache curl yasm pkg-config build-essential git python3-distro unzip tree libxml2-utils

      - name: Cache Qt installation
        uses: actions/cache@v4
        id: qt-cache
        with:
          path: ${{ runner.temp }}/Qt
          key: qt-install-${{ runner.os }}-${{ env.QT_VERSION }}

      - name: Install Qt (only if not cached)
        uses: jurplel/install-qt-action@v4
        with:
          version:      '5.15.19'
          host:         linux
          target:       android
          use-official: true
          email:        ${{ secrets.QT_EMAIL }}
          pw:           ${{ secrets.QT_PASSWORD }}
          dir:          ${{ runner.temp }}
          modules:      qtcharts
          setup-python: true


      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: false
          local-cache: true

      - name: Prepare ccache timestamp
        id: ccache_cache_timestamp
        shell: cmake -P {0}
        run: |
          string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
          message("::set-output name=timestamp::${current_date}")

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path:         ~/.ccache
          key:          ${{ runner.os }}-ccache-${{steps.ccache_cache_timestamp.outputs.timestamp}}
          restore-keys: ${{ runner.os }}-ccache-

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          echo "base_dir = ${GITHUB_WORKSPACE}" > ~/.ccache/ccache.conf
          echo "compression = true" >> ~/.ccache/ccache.conf
          echo "compression_level = 5" >> ~/.ccache/ccache.conf
          ccache -s
          ccache -z

      - name: Create build directory
        run: mkdir ${{ runner.temp }}/shadow_build_dir

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          set -euxo pipefail

          export SDK_ROOT=/usr/local/lib/android/sdk
          export CMDLINE_DIR=$SDK_ROOT/cmdline-tools
          export CMDLINE_BIN=$CMDLINE_DIR/latest/bin

          echo "Cleaning any stale SDK platform..."
          sudo rm -rf "$SDK_ROOT/platforms/android-35"

          echo "Creating cmdline-tools structure..."
          sudo mkdir -p "$CMDLINE_DIR"
          cd "$CMDLINE_DIR"

          echo "Downloading SDK cmdline tools..."
          sudo wget -v https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip

          echo "Unzipping cmdline tools..."
          sudo unzip -q tools.zip
          sudo mv cmdline-tools latest

          echo "Setting PATH..."
          export PATH="$CMDLINE_BIN:$PATH"

          echo "Accepting SDK licenses..."
          sudo mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee "$SDK_ROOT/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$SDK_ROOT/licenses/android-sdk-preview-license"

          echo "Installing Android platform 35 and build-tools 35.0.0 ..."
          # Use --licenses to accept all and avoid prompts
          yes | "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" --licenses || true

          # Install both platform and build-tools
          "$CMDLINE_BIN/sdkmanager" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0" --verbose

          echo "Confirming android.jar exists:"
          ls -lh "$SDK_ROOT/platforms/android-35/android.jar"
          file "$SDK_ROOT/platforms/android-35/android.jar"

          echo "Confirming build-tools 35.0.0 exists:"
          ls -lh "$SDK_ROOT/build-tools/35.0.0/" || true

          echo "Done installing Android SDK platform 35 and build-tools 35.0.0."
      - name: Set ANDROID_HOME and ANDROID_SDK_ROOT
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
      
      - name: Ensure SDK permissions
        run: sudo chmod -R a+rX /usr/local/lib/android/sdk
      
      - name: Install GStreamer & FFmpeg (matching arch)
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export API=35
          export TOOLCHAIN=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export RANLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"


          ls /usr/local/lib/android/sdk/platforms/android-35/

          if [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            AR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          elif [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            AR="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          else
            echo "[ERROR] Unknown arch: $ARCH"
            exit 1
          fi

          echo "Using AR: $AR"
          ls -l "$AR"

          if [[ "${{ matrix.architecture }}" == "armv7" ]]; then
            export TARGET=armv7a-linux-androideabi
            export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            export AR=$TOOLCHAIN/bin/llvm-ar
            ./fetch_extract_locally.sh -armv7
          elif [[ "${{ matrix.architecture }}" == "armv8" ]]; then
            export TARGET=aarch64-linux-android
            export CC=$TOOLCHAIN/bin/${TARGET}${API}-clang
            export AR=$TOOLCHAIN/bin/llvm-ar
            ./fetch_extract_locally.sh -arm64
          else
            echo "Unsupported architecture: ${{ matrix.architecture }}"
            exit 1
          fi
      
      - name: Replace QtLoader.java with static-only version
        run: |
            QT_BINDINGS_DIR=$(find ${{ runner.temp }}/Qt -type d -path "*/android/src/android/java/src/org/qtproject/qt5/android/bindings" | head -n1)
            if [[ -f "$QT_BINDINGS_DIR/QtLoader.java" ]]; then
              echo "Replacing $QT_BINDINGS_DIR/QtLoader.java"
              cat > "$QT_BINDINGS_DIR/QtLoader.java" <<'EOF'
        package org.qtproject.qt5.android.bindings;
        
        import android.app.Activity;
        import android.content.Intent;
        import android.os.Bundle;
        
        public class QtLoader extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                Intent intent = new Intent(getApplicationContext(), QOpenHDActivity.class);
                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getApplicationContext().startActivity(intent);
                finish();
            }
        }
        EOF
            else
              echo "QtLoader.java not found, build may fail."
              exit 1
            fi
        
      - name: list failiours
        if: failure()
        working-directory: ${{ github.workspace }}/lib/gstreamer_prebuilts
        run: |
            ls -a
            tree
      
      - name: Upload FFmpeg config.log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-config-log-${{ matrix.architecture }}
          path: ${{ github.workspace }}/lib/gstreamer_prebuilts/ffmpeg-6.1.1/ffbuild/config.log

      - name: Check Gradle version
        run: gradle --version

      - name: Install Gradle 8.6
        run: |
          wget https://services.gradle.org/distributions/gradle-8.6-bin.zip
          unzip -q gradle-8.6-bin.zip -d $HOME/gradle-8.6
          echo "$HOME/gradle-8.6/gradle-8.6/bin" >> $GITHUB_PATH

      - name: QMake Configure QOpenHD
        id: qmake
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          qmake ${SOURCE_DIR}/QOpenHD.pro -spec android-clang CONFIG+=installer ANDROID_ABIS="${{ matrix.eabi }}" BUILD_TYPE=Release

      - name: Run make qmake_all
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: make -j$(($(nproc)/2)) qmake_all

      - name: Run make
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: make -j12

      - name: Run make install
        working-directory: ${{ runner.temp }}/shadow_build_dir
        run: make install INSTALL_ROOT=android

      - name: Prepare Gradle wrapper and AndroidX config
        working-directory: ${{ runner.temp }}/shadow_build_dir/android
        run: |
          mkdir -p gradle/wrapper

          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

          cat > gradle/wrapper/gradle-wrapper.properties <<EOF
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          EOF

      - name: Run androiddeployqt (non-fatal)
        working-directory: ${{ runner.temp }}/shadow_build_dir
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          androiddeployqt \
            --output android \
            --verbose \
            --input android-QOpenHD-deployment-settings.json \
            --android-platform android-35 \
            --release \
            --sign ${SOURCE_DIR}/android/qopenhd_key.jks qopenhd_key \
            --storepass '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
            --no-ministro || true
      
      - name: Patch AndroidManifest.xml (remove `package`)
        working-directory: ${{ runner.temp }}/shadow_build_dir/android
        run: |
          MANIFEST=$(find . -name AndroidManifest.xml | head -n1)
          if [ -f "$MANIFEST" ]; then
            echo "Patching $MANIFEST"
            sed -i '/<manifest /s/ package="[^"]*"//' "$MANIFEST"
            echo "Validated patched manifest:"
            head -n 10 "$MANIFEST"
            xmllint --noout "$MANIFEST"
          else
            echo "Manifest not found"
            exit 1
          fi
      
      - name: Build .aab with Gradle
        id: gradle
        working-directory: ${{ runner.temp }}/shadow_build_dir/android
        continue-on-error: true
        run: gradle bundleRelease || exit 66

      - name: Upload signed APK (if exists)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SignedAPK_${{ matrix.eabi }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/apk/android-release-signed.apk
      

      - name: Upload final .aab if Gradle succeeded
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/bundle/release/*.aab

      - name: Print Android build logs (optional)
        if: failure()
        run: |
          echo "Dumping Android logs..."
          find android -type f \( -name "*.log" -o -name "*.txt" \) -exec echo "== {} ==" \; -exec cat {} \; || true

      - name: ccache post-run
        run: ccache -s

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ARTIFACT }}
          path: ${{ runner.temp }}/shadow_build_dir/android/build/outputs/bundle/release/*.aab
