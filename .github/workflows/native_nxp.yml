name: Native NXP video checks
on:
  push:
    branches: [dev-release]
  pull_request:
jobs:
  parser-and-packaging:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: RTP bounds, loss and restart regression
        run: |
          g++ -std=c++17 -g -fsanitize=address,undefined -Iapp tests/nxp_rtp_test.cpp -o /tmp/nxp-rtp-test
          /tmp/nxp-rtp-test
      - name: Validate native build scripts
        run: |
          for script in tools/nxp-*.sh tools/build_orqa_bundle.sh; do bash -n "$script"; done
          python3 - <<'PY'
          import ast, pathlib
          for path in pathlib.Path('tools').glob('nxp-*.py'):
              ast.parse(path.read_text())
          PY
      - name: PAM runtime directory and compositor readiness regression
        run: python3 tests/nxp_startup_test.py
      - name: Deployment archive ownership regression
        run: python3 tests/nxp_bundle_test.py
      - name: Native boot movie timing and bounds regression
        run: python3 tests/nxp_boot_video_test.py

  maps:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Qt map test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y qtbase5-dev qtdeclarative5-dev-tools qml-module-qttest qml-module-qtquick-controls2 qml-module-qtquick-layouts qml-module-qtlocation qml-module-qtpositioning libqt5location5-plugin-mapboxgl
      - name: Saved map settings restore after widget construction
        run: python3 tests/run_map_provider_test.py --qt-bin /usr/lib/qt5/bin
      - name: Offline map generation and playback
        run: |
          cmake -S tests/offline-map-builder -B /tmp/offline-map-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/offline-map-tests -j2
          /tmp/offline-map-tests/offline-map-builder-test
      - name: Automatic position fallback
        run: python3 tests/run_position_fallback_test.py --qt-bin /usr/lib/qt5/bin
      - name: Map tile adapter rejects invalid and unconfigured requests
        run: bash ci/test-map-raster.sh
      - name: Supported distro runtime dependencies
        run: python3 ci/test_package_dependencies.py
